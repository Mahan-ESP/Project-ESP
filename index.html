<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>VORTEX OS</title>

<style>
:root{
  --bg:#05070b;
  --panel:#0b1018;
  --panel2:#101722;
  --border:#1c2938;
  --text:#f2f7ff;
  --muted:#8391a3;
  --cyan:#2ee6ff;
  --green:#36ef9a;
  --red:#ff5268;
  --yellow:#ffd45c;
  --purple:#9b7cff;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
}

button:active{
  transform:scale(.96);
}

.hidden{
  display:none!important;
}

/* ================= APP ================= */

.app{
  width:100%;
  min-height:100vh;
  padding:12px;
  max-width:1250px;
  margin:auto;
}

/* ================= HEADER ================= */

.header{
  height:62px;
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:12px;
}

.logo{
  margin-left:auto;
}

.logo strong{
  display:block;
  font-size:24px;
  letter-spacing:4px;
}

.logo small{
  color:var(--muted);
  font-size:9px;
  letter-spacing:1px;
}

.header-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#101824,#080d14);
  color:white;
  cursor:pointer;
  display:grid;
  place-items:center;
  box-shadow:0 8px 25px #0007;
}

.connection{
  padding:8px 10px;
  border-radius:999px;
  font-size:10px;
  color:var(--green);
  border:1px solid #164c38;
  background:#071610;
}

/* ================= PAGES ================= */

.page{
  display:none;
  animation:pageIn .22s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* ================= CARDS ================= */

.card{
  background:
    linear-gradient(145deg,
      rgba(15,22,32,.98),
      rgba(7,11,17,.98)
    );
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
}

.card-title h2,
.card-title h3{
  margin:0;
  font-size:14px;
}

.card-title span{
  color:var(--muted);
  font-size:10px;
}

/* ================= HOME ================= */

.home-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:12px;
}

.robot-card{
  padding:20px;
  min-height:245px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.robot-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.robot-name{
  font-size:12px;
  color:var(--muted);
}

.robot-state{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
}

.state-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 15px var(--red);
}

.robot-card.on .state-dot{
  background:var(--green);
  box-shadow:0 0 15px var(--green);
}

.power-btn{
  width:128px;
  height:128px;
  border-radius:50%;
  margin:auto;
  border:1px solid #253448;
  background:
    radial-gradient(circle at 35% 30%,#1a2838,#070b11 65%);
  color:#aab8c9;
  cursor:pointer;
  box-shadow:
    inset 0 0 30px #000,
    0 0 35px #000;
  font-size:30px;
  transition:.25s;
}

.power-btn small{
  display:block;
  margin-top:8px;
  font-size:10px;
  color:var(--muted);
}

.robot-card.on .power-btn{
  color:var(--green);
  border-color:#267453;
  box-shadow:
    inset 0 0 30px #07160f,
    0 0 30px #1ed77d33;
}

/* ================= STATUS ================= */

.status-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:0 12px 12px;
}

.status-item{
  min-height:78px;
  border:1px solid var(--border);
  border-radius:16px;
  background:#09101a;
  padding:11px;
  cursor:pointer;
  transition:.18s;
}

.status-item:hover{
  border-color:#29425a;
}

.status-icon{
  font-size:18px;
}

.status-item small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:5px;
}

.status-item b{
  display:block;
  font-size:12px;
  margin-top:3px;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.yellow{
  color:var(--yellow);
}

.cyan{
  color:var(--cyan);
}

/* ================= CONTROL PREVIEW ================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  padding:0 12px 12px;
}

.quick{
  min-height:70px;
  border:1px solid var(--border);
  border-radius:16px;
  background:#09101a;
  color:white;
  cursor:pointer;
  padding:8px;
}

.quick span{
  display:block;
  font-size:18px;
}

.quick small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:5px;
}

/* ================= BIG CONTROL BUTTON ================= */

.open-control{
  width:100%;
  min-height:78px;
  border:1px solid #24536a;
  border-radius:19px;
  background:
    linear-gradient(
      135deg,
      #0b2733,
      #071017
    );
  color:white;
  cursor:pointer;
  margin-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  box-shadow:0 0 35px #1ce4ff0c;
}

.open-control strong{
  display:block;
  color:var(--cyan);
  font-size:15px;
}

.open-control small{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:10px;
}

.open-control b{
  font-size:28px;
}

/* ================= CONTROL PAGE ================= */

.control-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.movement-card{
  min-height:430px;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.movement-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.dpad{
  direction:ltr;
  display:grid;
  grid-template-columns:70px 70px 70px;
  grid-template-rows:70px 70px 70px;
  gap:9px;
}

.move{
  border:1px solid #25384b;
  background:
    linear-gradient(145deg,#121d29,#080e15);
  color:white;
  border-radius:19px;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 10px 25px #0007;
}

.move.up{
  grid-column:2;
}

.move.left{
  grid-column:1;
  grid-row:2;
}

.move.stop{
  grid-column:2;
  grid-row:2;
  color:var(--red);
  border-color:#632635;
}

.move.right{
  grid-column:3;
  grid-row:2;
}

.move.down{
  grid-column:2;
  grid-row:3;
}

/* ================= CAMERA NECK ================= */

.neck{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.neck button{
  height:46px;
  border:1px solid var(--border);
  background:#09101a;
  color:white;
  border-radius:14px;
  cursor:pointer;
}

.neck button:nth-child(2){
  grid-column:2;
}

/* ================= CONTROL OPTIONS ================= */

.options{
  padding:15px;
  display:grid;
  gap:10px;
}

.option{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:58px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#09101a;
}

.option-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.option-icon{
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#111b27;
}

.option-info small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.option-info b{
  display:block;
  font-size:12px;
  margin-top:2px;
}

/* ================= SWITCH ================= */

.switch{
  position:relative;
  width:48px;
  height:28px;
  flex:none;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  border-radius:30px;
  background:#17202b;
  border:1px solid #263546;
  cursor:pointer;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  top:3px;
  right:4px;
  border-radius:50%;
  background:#718094;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#0c4937;
  border-color:#267b5c;
}

.switch input:checked + .slider:before{
  transform:translateX(-19px);
  background:var(--green);
}

/* ================= SLIDER ================= */

.speed-box{
  padding:15px;
}

.speed-head{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:10px;
}

.speed-head span{
  color:var(--muted);
}

input[type=range]{
  width:100%;
  accent-color:var(--cyan);
}

/* ================= BEEP / AUTO ================= */

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.action-btn{
  min-height:62px;
  border:1px solid var(--border);
  border-radius:16px;
  background:#09101a;
  color:white;
  cursor:pointer;
}

.action-btn.active{
  border-color:#2a725a;
  background:#0a1d16;
  color:var(--green);
}

/* ================= CAMERA PAGE ================= */

.camera-page{
  position:relative;
  width:100%;
  height:calc(100vh - 86px);
  min-height:500px;
  overflow:hidden;
  border-radius:24px;
  background:#020406;
  border:1px solid var(--border);
}

.camera-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      ellipse at center,
      #182a3b 0,
      #09131e 32%,
      #020406 75%
    );
}

.camera-grid{
  position:absolute;
  inset:0;
  opacity:.18;
  background:
    linear-gradient(#35e7ff18 1px,transparent 1px),
    linear-gradient(90deg,#35e7ff18 1px,transparent 1px);
  background-size:45px 45px;
}

.camera-scan{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  top:0;
  background:linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    transparent
  );
  opacity:.5;
  animation:scan 4s linear infinite;
}

@keyframes scan{
  from{top:0}
  to{top:100%}
}

.camera-message{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#718197;
  font-size:12px;
}

.camera-top{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:5;
}

.camera-top span{
  background:#020508bb;
  border:1px solid #26384a;
  border-radius:11px;
  padding:8px 10px;
  font-size:10px;
}

.camera-top button{
  width:42px;
  height:42px;
  border:1px solid #26384a;
  background:#020508bb;
  color:white;
  border-radius:13px;
  cursor:pointer;
}

/* Camera controls */
.camera-controls{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.camera-dpad{
  position:absolute;
  bottom:22px;
  left:22px;
  direction:ltr;
}

.camera-dpad .dpad{
  transform:scale(.85);
  transform-origin:bottom left;
}

.camera-neck{
  position:absolute;
  bottom:25px;
  right:25px;
  display:grid;
  grid-template-columns:48px 48px 48px;
  gap:7px;
  direction:ltr;
}

.camera-neck button{
  width:48px;
  height:48px;
  border:1px solid #ffffff2c;
  background:#07111ccc;
  backdrop-filter:blur(12px);
  color:white;
  border-radius:14px;
  cursor:pointer;
  pointer-events:auto;
}

.camera-neck button:nth-child(2){
  grid-column:2;
}

.camera-hint{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  color:#8190a2;
  font-size:9px;
  white-space:nowrap;
}

/* ================= DRAWER ================= */

.drawer{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#0009;
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.drawer.open{
  opacity:1;
  visibility:visible;
}

.drawer-panel{
  position:absolute;
  top:0;
  bottom:0;
  right:0;
  width:min(88vw,390px);
  background:#080d14;
  border-left:1px solid var(--border);
  padding:18px;
  transform:translateX(100%);
  transition:.25s;
  box-shadow:-25px 0 60px #000b;
  overflow-y:auto;
}

.drawer.open .drawer-panel{
  transform:translateX(0);
}

.drawer-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.drawer-title strong{
  letter-spacing:1px;
}

.drawer-close{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#0d141d;
  color:white;
  cursor:pointer;
}

.drawer-item{
  min-height:60px;
  border-bottom:1px solid #162230;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.drawer-item span{
  color:var(--muted);
  font-size:11px;
}

.drawer-item b{
  font-size:12px;
}

/* ================= RADAR ================= */

.radar-wrap{
  padding:12px;
}

#radar{
  display:block;
  width:100%;
  height:250px;
  background:#050a10;
  border-radius:18px;
}

/* ================= LANDSCAPE ================= */

@media(max-width:900px) and (orientation:landscape){

  .app{
    padding:8px;
  }

  .header{
    height:45px;
    margin-bottom:8px;
  }

  .logo strong{
    font-size:19px;
  }

  .home-grid{
    grid-template-columns:1fr 1fr;
  }

  .robot-card{
    min-height:200px;
  }

  .power-btn{
    width:95px;
    height:95px;
  }

  .control-layout{
    grid-template-columns:1.1fr .9fr;
  }

  .movement-card{
    min-height:calc(100vh - 70px);
  }

  .camera-page{
    height:calc(100vh - 61px);
    min-height:300px;
    border-radius:18px;
  }

  .connection{
    display:none;
  }
}

/* ================= MOBILE PORTRAIT ================= */

@media(max-width:650px){

  .app{
    padding:8px;
  }

  .header{
    height:52px;
  }

  .logo strong{
    font-size:20px;
  }

  .connection{
    display:none;
  }

  .home-grid{
    grid-template-columns:1fr;
  }

  .robot-card{
    min-height:260px;
  }

  .control-layout{
    grid-template-columns:1fr;
  }

  .movement-card{
    min-height:390px;
  }

  .camera-page{
    height:calc(100vh - 74px);
    min-height:430px;
  }

  .camera-neck{
    right:14px;
    bottom:18px;
  }

  .camera-dpad{
    left:8px;
    bottom:10px;
  }

  .camera-hint{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    <strong>VORTEX</strong>
    <small>ROBOT CONTROL SYSTEM</small>
  </div>

  <div class="connection">
    ● DEMO
  </div>

  <button class="header-btn" id="orientationBtn" title="حالت افقی">
    ↔
  </button>

  <button class="header-btn" id="menuBtn" title="منو">
    ⋮
  </button>

</header>


<!-- ======================================================
     HOME PAGE
====================================================== -->

<section class="page active" id="homePage">

  <div class="home-grid">

    <!-- ROBOT -->

    <div class="card robot-card" id="robotCard">

      <div class="robot-head">

        <div>
          <div class="robot-name">VORTEX ROBOT</div>
          <div style="font-size:20px;font-weight:800;margin-top:4px">
            وضعیت ربات
          </div>
        </div>

        <div class="robot-state">
          <span class="state-dot"></span>
          <span id="robotStateText">خاموش</span>
        </div>

      </div>


      <button class="power-btn" id="powerBtn">
        ⏻
        <small>روشن / خاموش</small>
      </button>

    </div>


    <!-- STATUS -->

    <div class="card">

      <div class="card-title">
        <h3>وضعیت سیستم</h3>
        <span>LIVE</span>
      </div>

      <div class="status-grid">

        <button class="status-item" id="tempCard">
          <span class="status-icon">🌡️</span>
          <small>دما</small>
          <b class="cyan" id="tempValue">31°C</b>
        </button>

        <button class="status-item">
          <span class="status-icon">⚙️</span>
          <small>موتور</small>
          <b id="motorStatus">خاموش</b>
        </button>

        <button class="status-item">
          <span class="status-icon">🔋</span>
          <small>شارژ</small>
          <b class="green" id="batteryValue">82%</b>
        </button>

        <button class="status-item">
          <span class="status-icon">🔌</span>
          <small>وضعیت شارژ</small>
          <b id="chargingValue">متصل نیست</b>
        </button>

      </div>

    </div>


    <!-- LIGHT / FAN / CAMERA -->

    <div class="card">

      <div class="card-title">
        <h3>امکانات ربات</h3>
        <span>MODULES</span>
      </div>

      <div class="quick-grid">

        <button class="quick toggle-quick" data-target="led">
          <span>💡</span>
          <small>چراغ LED</small>
        </button>

        <button class="quick toggle-quick" data-target="fan">
          <span>🌀</span>
          <small>فن خنک‌کننده</small>
        </button>

        <button class="quick" id="calibrateHome">
          <span>📷</span>
          <small>کالیبره دوربین</small>
        </button>

        <button class="quick toggle-quick" data-target="camLight">
          <span>🔦</span>
          <small>چراغ دوربین</small>
        </button>

        <button class="quick toggle-quick" data-target="night">
          <span>🌙</span>
          <small>دید در شب</small>
        </button>

        <button class="quick">
          <span>📡</span>
          <small>ارتباط</small>
        </button>

      </div>

    </div>


    <!-- CONTROL -->

    <div>

      <div class="card" style="padding:12px">

        <button class="open-control" id="openControl">

          <div>
            <strong>صفحه کنترل</strong>
            <small>کنترل کامل حرکت و امکانات ربات</small>
          </div>

          <b>→</b>

        </button>

      </div>

    </div>

  </div>

</section>


<!-- ======================================================
     CONTROL PAGE
====================================================== -->

<section class="page" id="controlPage">

  <div class="control-layout">

    <!-- MOVEMENT -->

    <div class="card movement-card">

      <div class="card-title" style="padding:0">
        <h3>کنترل حرکت</h3>
        <span id="speedText">سرعت 50%</span>
      </div>

      <div class="movement-area">

        <div class="dpad">

          <button class="move up" data-command="forward">▲</button>
          <button class="move left" data-command="left">◀</button>
          <button class="move stop" data-command="stop">■</button>
          <button class="move right" data-command="right">▶</button>
          <button class="move down" data-command="back">▼</button>

        </div>

      </div>


      <!-- CAMERA NECK -->

      <div class="card-title" style="padding:0 0 8px">
        <h3>گردن دوربین</h3>
        <span id="cameraAngle">0°</span>
      </div>

      <div class="neck">

        <button data-neck="left">←</button>
        <button data-neck="center">●</button>
        <button data-neck="right">→</button>

      </div>

    </div>


    <!-- OPTIONS -->

    <div class="card">

      <div class="card-title">
        <h3>کنترل‌های سریع</h3>
        <span>CONTROL</span>
      </div>

      <div class="options">
