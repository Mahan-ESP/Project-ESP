<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#030508">

<title>VORTEX OS</title>

<style>
:root{
  --bg:#030508;
  --panel:#080d13;
  --glass:rgba(8,15,22,.62);
  --line:rgba(0,240,255,.16);
  --cyan:#00efff;
  --cyan2:#52f6ff;
  --purple:#9d65ff;
  --green:#42f5ad;
  --red:#ff466d;
  --orange:#ffad67;
  --text:#eafaff;
  --muted:#78909f;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
}

button:active{
  transform:scale(.96);
}

/* BACKGROUND */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background:
    linear-gradient(rgba(0,240,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(#000,transparent 90%);
}

/* HEADER */

header{
  height:72px;
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 18px;
  background:rgba(3,7,11,.86);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.logo{
  direction:ltr;
  font:bold 27px Arial;
  letter-spacing:4px;
  text-shadow:0 0 22px rgba(0,240,255,.35);
}

.logo span{
  color:var(--cyan);
}

.version{
  color:var(--muted);
  font:9px Arial;
  letter-spacing:2px;
  margin-top:4px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn{
  width:43px;
  height:43px;
  border:1px solid rgba(0,240,255,.2);
  border-radius:12px;
  background:rgba(11,22,30,.7);
  color:#bdeff5;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:.2s;
}

.icon-btn:hover{
  border-color:var(--cyan);
  box-shadow:0 0 20px rgba(0,240,255,.15);
}

.connection{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid rgba(255,173,103,.2);
  border-radius:10px;
  padding:8px 10px;
  color:var(--orange);
  font:10px Arial;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--orange);
  box-shadow:0 0 9px var(--orange);
}

/* MAIN */

main{
  position:relative;
  z-index:1;
  max-width:1600px;
  margin:auto;
  padding:18px;
}

.dashboard{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);
  gap:15px;
}

/* CAMERA */

.camera-panel{
  min-width:0;
}

.camera{
  height:min(68vh,590px);
  min-height:330px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(0,240,255,.2);
  border-radius:18px;
  background:
    radial-gradient(circle at center,#0b2830,#050a0f 65%);
  cursor:pointer;
  box-shadow:
    inset 0 0 45px rgba(0,240,255,.025),
    0 15px 50px rgba(0,0,0,.4);
}

  position:absolute;
